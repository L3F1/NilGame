<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curved Space — Geometry Playground</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #hud {
    position: fixed; left: 12px; top: 12px;
    font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #9fe; text-shadow: 0 1px 2px #000; pointer-events: none;
    white-space: pre;
  }
  /* Anything that stops the module dead lands here instead of in the console,
     where nobody looks. A GLSL compile failure and a JavaScript syntax error
     draw exactly the same black canvas, and the difference between a five
     second fix and an hour of guessing is being told which one it was. */
  #boot {
    position: fixed; left: 0; right: 0; top: 0; padding: 14px 18px;
    font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
    color: #fdd; background: #601018; white-space: pre-wrap;
    display: none; max-height: 60%; overflow: auto; z-index: 100;
  }
  * { box-sizing: border-box; }
  button, select { font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, select:focus-visible, summary:focus-visible {
    outline: 2px solid #ecbd75; outline-offset: 4px;
  }
  button:disabled { cursor: wait; opacity: .6; }
  [hidden] { display: none !important; }
  #worlds-button { position: fixed; top: 18px; right: 20px; z-index: 5;
    padding: 12px 18px; border: 1px solid #56616d; border-radius: 8px;
    background: #101b27ed; color: #e8edf3; font: 600 14px system-ui, sans-serif; }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid #64717c;
    padding: 2px 5px; margin-left: 12px; border-radius: 3px; }
  #menu { position: fixed; inset: 0; z-index: 15; overflow: auto;
    background: #0c131d; color: #e7ecf1; font: 14px/1.5 system-ui, sans-serif;
    background-image: radial-gradient(ellipse at 85% 0%, #233749 0%, transparent 55%); }
  .menu-shell { max-width: 1180px; margin: auto; padding: 42px 32px 26px; }
  .menu-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
  .eyebrow { color: #e8b66c; font: 11px ui-monospace, monospace; letter-spacing: .16em; margin: 0 0 12px; }
  #menu h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 550; letter-spacing: -.04em; margin: 0; }
  .menu-intro { color: #a6b5c5; margin: 8px 0 0; }
  .resume { background: #e8b66c; color: #16202a; padding: 13px 17px;
    border: 0; border-radius: 6px; font-weight: 650; white-space: nowrap; }
  .resume kbd { border-color: #977950; }
  .world-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
  .world-card { display: flex; flex-direction: column; align-items: flex-start; text-align: left;
    min-height: 190px; padding: 22px; border: 1px solid #3b4b5e; border-radius: 8px;
    color: #e7ecf1; background: #15212ed9; transition: border-color .15s, background .15s; }
  .world-card:hover { background: #203347; border-color: #8cabc7; }
  .world-card[aria-pressed="true"] { border-color: #e8b66c; background: #2d2d2b; }
  .world-badge { color: #93b9d5; font: 11px ui-monospace, monospace; letter-spacing: .04em; }
  .world-card strong { font-size: 20px; font-weight: 550; margin: 13px 0 6px; }
  .world-note { color: #a9b8c8; font-size: 13px; }
  .world-action { color: #e8b66c; font-size: 12px; padding-top: 18px; margin-top: auto; }
  .menu-status { color: #c5d0da; min-height: 24px; font-size: 13px; margin: 22px 0; }
  .settings { border-top: 1px solid #354252; border-bottom: 1px solid #354252; padding: 18px 0; }
  .settings summary { cursor: pointer; font-size: 15px; }
  .settings-help { color: #a9b8c8; font-size: 12px; }
  .settings-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding: 8px 0; }
  .setting-row label { display: block; margin-bottom: 6px; color: #c5d0da; }
  .setting-row select { width: 100%; background: #15212e; color: #e7ecf1;
    border: 1px solid #526172; padding: 9px; border-radius: 4px; }
  .setting-row select:disabled { opacity: .65; }
  .setting-row small { display: block; color: #b6a386; margin-top: 4px; font-size: 11px; }
  .menu-footer { display: flex; justify-content: space-between; gap: 15px;
    color: #8d9cad; font-size: 11px; margin-top: 22px; }
  @media (max-width: 780px) {
    .menu-shell { padding: 24px 18px; }
    .world-grid, .settings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .menu-header { align-items: flex-start; flex-direction: column; }
    .menu-footer { flex-direction: column; }
    #hud { max-width: calc(100vw - 24px); overflow: hidden; font-size: 11px; }
  }
  @media (max-width: 450px) {
    .world-grid, .settings-grid { grid-template-columns: 1fr; }
    .world-card { min-height: 155px; }
  }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="boot"></div>
  <button type="button" id="worlds-button" aria-haspopup="dialog">Explore worlds <kbd>O</kbd></button>
  <script>
    // Plain script, and before the module, so it is already listening when the
    // module fails to parse, fails to link, or throws on its first line.
    // Report the FIRST error and then only count the rest: a dead frame loop
    // throws every frame, and the tenth copy overwrites the one that matters.
    var reported = 0;
    function showError(message, where, stack) {
      var b = document.getElementById('boot');
      if (!b) return;
      if (++reported > 1) {
        var more = document.getElementById('boot-more');
        if (more) more.textContent = '\n(' + (reported - 1) + ' further errors suppressed)';
        return;
      }
      // "did not start" was a lie whenever the game had been running, and it
      // sent a real crash report off to hunt an imaginary boot failure.
      var ran = window.__nilRan;
      b.style.display = 'block';
      b.textContent = [
        ran ? 'THE GAME CRASHED WHILE RUNNING' : 'THE PAGE DID NOT START',
        '',
        message || 'unknown error',
        where,
        '',
        // The stack is the whole point. Without it a report says only
        // "geom.js:80", which is apply() - a leaf called from forty places,
        // and knowing the leaf tells you nothing about which caller broke it.
        stack ? 'Stack - the top line is where it threw, the lines below are\nwho called it. Copy all of this into a bug report:\n\n' + stack : '',
        '',
        ran
          ? 'The frame loop has stopped, so the picture is frozen on its last\ngood frame. Reload to carry on.'
          : 'A shader that failed to compile and JavaScript that failed to parse\nboth draw an identical black canvas. The message above says which.'
      ].join('\n');
      var more = document.createElement('span');
      more.id = 'boot-more';
      b.appendChild(more);
    }
    window.addEventListener('error', function (e) {
      showError(e.message || String(e.error),
        e.filename ? e.filename + ':' + e.lineno + (e.colno ? ':' + e.colno : '') : '',
        e.error && e.error.stack);
    });
    // A throw inside a promise never reaches the 'error' listener, so without
    // this one an async failure is a silent black canvas again.
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      showError('Unhandled promise rejection: ' + ((r && r.message) || String(r)),
        '', r && r.stack);
    });
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
