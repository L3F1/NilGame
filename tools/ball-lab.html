<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NilGame · Ball lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121c29;color:#dce7eb;font:16px system-ui;display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100dvh}canvas{width:100%;height:100%;min-height:300px}aside{padding:20px;overflow:auto}h1{font-size:24px}label{display:block;margin:10px 0}input[type=number]{width:100%;padding:7px}button{padding:8px;margin:4px 0}p{line-height:1.5}#status{color:#8ee5dc}#boot{color:#ffb9a9;white-space:pre-wrap}@media(max-width:600px){body{height:auto;grid-template-columns:1fr}canvas{height:50dvh}}
</style>
<script>window.addEventListener('error',e=>{document.getElementById('boot').textContent=e.message});window.addEventListener('unhandledrejection',e=>{document.getElementById('boot').textContent=String(e.reason)});</script>
</head><body><canvas id="c" aria-label="Ball preview"></canvas><aside>
<h1>BALL LAB / E3</h1><p>Scene v1 authoring experiment. Z is up; the camera stays fixed.</p>
<form id="editor"><label>X <input id="x" type="number" step="0.01" required></label><label>Y <input id="y" type="number" step="0.01" required></label><label>Z <input id="z" type="number" step="0.01" required></label><label>Radius <input id="radius" type="number" step="0.01" min="0.01" required></label><button>Apply edit</button></form>
<button id="undo">Undo</button> <button id="redo">Redo</button><br><button id="save">Save JSON</button><label>Load JSON <input id="load" type="file" accept=".json"></label>
<p id="query"></p><p id="status" role="status"></p><pre id="boot" role="alert"></pre>
</aside><script type="module" src="../app/ball-lab.js"></script></body></html>
